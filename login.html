<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Radiant Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="auth-container">
        <!-- Theme Toggle -->
        <button class="theme-toggle floating" id="themeToggle" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="images/logo.png" alt="Logo" style="height:36px;width:auto;margin-right:8px;">
                    <span>Radiant Attendance</span>
                </a>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your dashboard</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" required 
                           placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required 
                               placeholder="Enter your password">
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module">
        // Wait for Firebase to initialize from js/firebase.js
        const waitForFirebase = () => {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.firebaseAuth && window.firebaseDb) {
                        resolve();
                    } else {
                        setTimeout(check, 50);
                    }
                };
                check();
            });
        };

        waitForFirebase().then(() => {
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;

            // Password toggle
            document.getElementById('passwordToggle').addEventListener('click', () => {
                const input = document.getElementById('password');
                input.type = input.type === 'password' ? 'text' : 'password';
                const icon = document.getElementById('passwordToggle').querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });

            // Login form
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                document.getElementById('loadingOverlay').style.display = 'flex';
                try {
                    await window.signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    const msgs = {
                        'auth/invalid-credential': 'Invalid email or password.',
                        'auth/user-not-found': 'No account found with this email.',
                        'auth/wrong-password': 'Incorrect password.',
                        'auth/too-many-requests': 'Too many attempts. Try again later.'
                    };
                    alert(msgs[error.code] || 'Login failed. Please try again.');
                }
            });

            // Auth state — redirect if logged in, else hide loader
            window.onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const userDoc = await window.getDoc(window.doc(db, 'users', user.uid));
                        if (userDoc.exists()) {
                            const role = userDoc.data().role;
                            window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
                            return;
                        }
                    } catch(e) {
                        console.error('Error fetching user data:', e);
                    }
                }
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        });
    </script>
</body>
</html>
