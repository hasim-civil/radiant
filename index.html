<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Orbit Time - Employee Attendance Management</title>
    <meta name="description" content="Orbit Time is a modern employee attendance management system — check in/out, track working hours, manage holidays and paid leave, and generate reports, all in one place.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Orbit Time - Employee Attendance Management">
    <meta property="og:description" content="Track attendance, manage employees, and generate reports with a modern, easy-to-use attendance system.">
    <meta property="og:image" content="https://hasim-civil.github.io/radiant/images/icon-512.png">
    <meta property="og:url" content="https://hasim-civil.github.io/radiant/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Orbit Time - Employee Attendance Management">
    <meta name="twitter:description" content="Track attendance, manage employees, and generate reports with a modern, easy-to-use attendance system.">
    <meta name="twitter:image" content="https://hasim-civil.github.io/radiant/images/icon-512.png">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/aurora-theme.css">
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <script>
    /* Theme boot. Runs before first paint so there is never a flash of the
       wrong theme, which on a dark-theme phone is the difference between
       polished and broken. */
    (function () {
        try {
            var t = localStorage.getItem('sa-theme');
            if (['light', 'dark', 'glass'].indexOf(t) === -1) t = 'light';
            document.documentElement.setAttribute('data-theme', t);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'light' ? '#FFFFFF' : t === 'dark' ? '#101019' : '#120B2E');
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>
</head>
<body class="light-mode">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Landing Page -->
    <div class="landing-container">
        <!-- Hero Section — nav lives inside the photo overlay, not a
             separate bar, so it never needs to persist below the fold. -->
        <div class="hero-frame">
            <div class="hero-frame-glow" aria-hidden="true"></div>
            <section class="hero-photo">
                <div class="hero-photo-bg"></div>
                <div class="hero-photo-overlay"></div>

                <div class="hero-photo-nav">
                    <a href="index.html" class="hero-logo">
                        <i class="fas fa-clock"></i>
                        <span>Orbit Time</span>
                    </a>
                    <nav class="hero-pill-nav">
                        <a href="login.html">Login</a>
                        <a href="register.html" class="hero-pill-cta">Sign Up</a>
                    </nav>
                </div>

                <div class="hero-photo-content">
                    <h1>Attendance your team actually keeps up with</h1>
                    <p>Check in, track hours, and see who's working — live, from any device, without a single spreadsheet.</p>
                    <div class="hero-buttons">
                        <a href="register.html" class="btn btn-pill btn-pill-dark">
                            <i class="fas fa-rocket"></i> Start for Free
                        </a>
                        <a href="login.html" class="btn btn-pill btn-pill-brand">Sign In</a>
                    </div>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="landing-footer">
            <p class="creator-credit">Created by Hasim</p>
        </footer>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module">
        // Wait for Firebase to initialize from js/firebase.js
        const waitForFirebase = () => {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.firebaseAuth && window.firebaseDb) {
                        resolve();
                    } else {
                        setTimeout(check, 50);
                    }
                };
                check();
            });
        };

        waitForFirebase().then(() => {
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;

            // If already logged in, skip the landing page and go straight to the dashboard
            window.onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const userDoc = await window.getDoc(window.doc(db, 'users', user.uid));
                        if (userDoc.exists()) {
                            const role = userDoc.data().role;
                            window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
                            return;
                        }
                    } catch (e) {
                        console.error('Error fetching user data:', e);
                    }
                }
                // Not logged in (or lookup failed) -- show the landing page
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }).catch((e) => {
            console.error('Failed to initialize Firebase:', e);
            document.getElementById('loadingOverlay').style.display = 'none';
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
    <!-- GSAP is optional: ui.js orchestrates with it when present and falls
         back to CSS keyframes when it is blocked or offline. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="js/ui.js"></script>
</body>
</html>
