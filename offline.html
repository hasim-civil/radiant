<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Radiant Attendance</title>
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--spacing-xl);
        }
        .offline-container i {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-lg);
        }
        .offline-container h1 {
            font-size: 1.5rem;
            margin-bottom: var(--spacing-sm);
        }
        .offline-container p {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xl);
            max-width: 320px;
        }
    </style>
</head>
<body class="light-mode">
    <div class="offline-container">
        <i class="fas fa-wifi"></i>
        <h1>You're Offline</h1>
        <p>Can't reach Radiant Attendance right now. Check your connection and try again — any page you've already visited may still be available.</p>
        <button class="btn btn-primary" onclick="window.location.reload()">
            <i class="fas fa-redo"></i> Try Again
        </button>
    </div>
</body>
</html>
