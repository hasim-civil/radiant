<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - Smart Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="auth-container">

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="images/erasebg-transformed.png" alt="Logo" style="height:36px;width:auto;margin-right:8px;">
                    <span>Smart Attendance</span>
                </a>
                <h1><i class="fas fa-user-shield"></i> Admin Registration</h1>
                <p>Create an administrator account</p>
            </div>

            <form id="adminRegisterForm" class="auth-form">
                <div class="form-group">
                    <label for="adminCode">
                        <i class="fas fa-key"></i> Admin Access Code
                    </label>
                    <div class="password-input">
                        <input type="password" id="adminCode" name="adminCode" required 
                               placeholder="Enter secret admin code">
                        <button type="button" class="password-toggle" id="codeToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-hint">Contact your organization for the access code</small>
                </div>

                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input type="text" id="name" name="name" required 
                           placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" required 
                           placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required 
                               placeholder="Create a password" minlength="6">
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-hint">Password must be at least 6 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               placeholder="Confirm your password" minlength="6">
                        <button type="button" class="password-toggle" id="confirmPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeTerms" required>
                        <span>I agree to the <a href="#">Terms of Service</a></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-shield"></i> Create Admin Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
                <p>Register as employee? <a href="register.html">Employee Registration</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module">
        // =============================================
        // CHANGE THIS SECRET CODE TO YOUR OWN!
        // =============================================
        const ADMIN_SECRET_CODE = 'ADMINHASIM123';
        // =============================================

        // Wait for Firebase to initialize
        setTimeout(() => {
            hideLoading();
        }, 1000);

        // Password toggles
        function setupPasswordToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            
            if (toggle && input) {
                toggle.addEventListener('click', () => {
                    const type = input.type === 'password' ? 'text' : 'password';
                    input.type = type;
                    const icon = toggle.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
        }
        
        setupPasswordToggle('codeToggle', 'adminCode');
        setupPasswordToggle('passwordToggle', 'password');
        setupPasswordToggle('confirmPasswordToggle', 'confirmPassword');

        // Admin Register form submission
        const adminRegisterForm = document.getElementById('adminRegisterForm');
        adminRegisterForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const adminCode = document.getElementById('adminCode').value.trim();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Verify admin code FIRST
            if (adminCode !== ADMIN_SECRET_CODE) {
                showToast('Invalid admin access code!', 'error');
                return;
            }
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }
            
            showLoading();
            
            try {
                // Register as admin only if code is correct
                await registerUser(email, password, name, 'admin');
                showToast('Admin account created successfully! Redirecting...', 'success');
            } catch (error) {
                hideLoading();
                showToast(getErrorMessage(error.code), 'error');
            }
        });

        // Check if user is already logged in
        checkAuthState();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
